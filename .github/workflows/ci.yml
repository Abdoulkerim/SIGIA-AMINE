name: SIGIA-AMINE CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Reset database
        run: supabase db reset

      - name: Database tests
        run: supabase test db --local

      - name: Database lint
        run: supabase db lint --local

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
